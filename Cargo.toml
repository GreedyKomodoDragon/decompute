[workspace]
members = [
    "crates/decompute-core",
    "crates/decompute-llama",
    "crates/decompute-sdk",
    "crates/protocol",
    "crates/inference-example",
    "crates/worker",
    "crates/coordinator",
    "crates/client",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
encoding_rs = "0.8"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
llama-cpp-2 = { version = "0.1.154", default-features = false }
minijinja = { version = "2", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.33"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.dev]
debug = 0
incremental = false
