[package]
name = "decompute-llama"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "GGUF and llama.cpp runtime building blocks for the Decompute SDK"
keywords = ["decompute", "llama", "gguf", "llm"]
categories = ["api-bindings", "multimedia::images"]

[features]
default = []
runtime = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2"]
metal = ["runtime", "llama-cpp-2/metal"]

[dependencies]
anyhow.workspace = true
decompute-core.workspace = true
encoding_rs.workspace = true
llama-cpp-2 = { workspace = true, optional = true }
llama-cpp-sys-2 = { workspace = true, optional = true }
minijinja.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
tracing.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
