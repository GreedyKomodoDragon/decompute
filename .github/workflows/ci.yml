name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Format, lint, and test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew LLVM
        run: brew install llvm

      # Homebrew Clang needs an explicit SDK root on hosted macOS runners. This
      # keeps CMake, cc-rs, and native dependencies such as llama.cpp aligned
      # with the Xcode SDK rather than relying on implicit compiler discovery.
      - name: Configure native compiler and SDK
        run: |
          echo "CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=14.5" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check all features
        run: cargo check --workspace --all-targets --all-features

      - name: Test workspace
        run: cargo test --workspace
